<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis aplicaciones</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#0F1B2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B2D; --bg2:#13223A; --surface:#1B2C45; --surface2:#233754;
    --line:#2E4565; --text:#EEF2F7; --muted:#8FA1B8; --accent:#FFB84D; --accent-ink:#2B1A00;
    --danger:#FF6B6B; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Manrope',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(1200px 600px at 20% -10%, #1C3358 0%, var(--bg) 55%);
    min-height:100vh; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  body.busy{cursor:progress}
  header{padding:44px 40px 8px; display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap}
  header h1{margin:0; font-size:clamp(30px,4.5vw,52px); font-weight:800; letter-spacing:-.03em; display:flex; align-items:center; gap:14px}
  header h1 img{width:.8em;height:.8em}
  header .count{color:var(--muted); font-weight:500; font-size:15px}
  main{padding:8px 40px 120px}

  .cat{margin-top:34px}
  .cat h2{margin:0 0 14px; font-size:15px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:12px}
  .cat h2::after{content:""; flex:1; height:1px; background:var(--line)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:14px}

  .tile{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:18px 8px 14px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); color:inherit; text-decoration:none; cursor:pointer;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .tile:hover,.tile:focus-visible{background:var(--surface2); border-color:#3B5680; transform:translateY(-2px); outline:none}
  .tile:focus-visible{box-shadow:0 0 0 3px var(--accent)}
  .tile .ico{width:52px; height:52px; border-radius:14px; background:#fff; display:grid; place-items:center; overflow:hidden; font-weight:800; font-size:22px; color:var(--bg)}
  .tile .ico img{width:34px; height:34px; display:block}
  .tile .name{font-size:13px; font-weight:600; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tile .more{position:absolute; top:6px; right:6px; width:26px; height:26px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; opacity:0}
  .tile:hover .more,.tile:focus-within .more{opacity:1}
  .tile .more:hover{background:var(--bg); color:var(--text)}
  @media (hover:none){.tile .more{opacity:1}}

  .empty{margin:16vh auto 0; max-width:440px; text-align:center; color:var(--muted); font-size:17px; line-height:1.6}
  .empty strong{color:var(--text)}
  .empty .pulse{width:72px; height:72px; margin:0 auto 22px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-size:30px; color:var(--accent)}
  .empty.error .pulse{color:var(--danger); border-style:solid}
  .empty code{background:var(--surface); padding:2px 6px; border-radius:6px; font-size:14px}

  .fab-menu{position:fixed; z-index:50; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px; min-width:210px; box-shadow:0 20px 50px rgba(0,0,0,.45); display:none}
  .fab-menu.open{display:block}
  .fab-menu button{display:flex; width:100%; gap:10px; align-items:center; padding:11px 12px; border:0; border-radius:9px; background:transparent; color:var(--text); font:inherit; font-size:14px; font-weight:500; cursor:pointer; text-align:left}
  .fab-menu button:hover{background:var(--surface2)}
  .fab-menu button span{width:22px; text-align:center; color:var(--accent)}
  .fab-menu .sep{height:1px; background:var(--line); margin:5px 8px}

  .overlay{position:fixed; inset:0; background:rgba(5,12,24,.7); backdrop-filter:blur(4px); z-index:60; display:none; align-items:center; justify-content:center; padding:20px}
  .overlay.open{display:flex}
  .panel{width:min(460px,100%); background:var(--bg2); border:1px solid var(--line); border-radius:22px; padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.5); user-select:text}
  .panel h3{margin:0 0 18px; font-size:22px; font-weight:800; letter-spacing:-.02em}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:500}
  input,select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:15px}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,184,77,.25)}
  .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px}
  .btn{padding:11px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-weight:600; cursor:pointer}
  .btn:hover{background:var(--surface2)}
  .btn:disabled{opacity:.5; cursor:default}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{color:var(--danger); border-color:transparent; background:transparent; margin-right:auto}
  .btn.danger:hover{background:rgba(255,107,107,.12)}
  .preview{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--surface); margin-top:14px; min-height:58px}
  .preview .ico{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:15px;color:var(--bg)}
  .preview img{width:22px;height:22px}
  .preview .t{font-size:13px; color:var(--muted)}
  .preview .t b{display:block; color:var(--text); font-size:14px}

  .order-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow:auto}
  .order-list li{display:flex; align-items:center; gap:10px; padding:10px 10px 10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
  .order-list li.dragging{opacity:.4}
  .order-list .grip{color:var(--muted); cursor:grab; font-size:18px}
  .order-list .nm{flex:1; font-weight:600}
  .order-list .n{color:var(--muted); font-size:12px}
  .order-list .ic{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);cursor:pointer;font-size:14px}
  .order-list .ic:hover{background:var(--surface2)}
  .order-list .ic:disabled{opacity:.3; cursor:default}

  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px; font-weight:600; font-size:14px; opacity:0; transition:.25s; z-index:80; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%)}
  .toast.err{background:var(--danger); color:#fff}
  .hint{position:fixed; right:22px; bottom:20px; color:var(--muted); font-size:12px; opacity:.7}
  .sync{position:fixed; left:22px; bottom:20px; color:var(--muted); font-size:12px; opacity:0; transition:.2s}
  .sync.show{opacity:.8}
  @media (max-width:600px){header,main{padding-left:18px;padding-right:18px} header{padding-top:28px} .hint{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1><img src="favicon.svg" alt="">Mis aplicaciones</h1>
  <div class="count" id="count"></div>
</header>
<main id="main"><div class="empty"><div class="pulse">…</div>Cargando tus webs</div></main>
<div class="hint">Triple clic en el fondo para abrir el menú</div>
<div class="sync" id="sync">Guardando…</div>

<div class="fab-menu" id="menu">
  <button data-act="add"><span>+</span>Añadir web</button>
  <button data-act="order"><span>⇅</span>Ordenar categorías</button>
  <div class="sep"></div>
  <button data-act="reload"><span>↻</span>Recargar</button>
</div>

<div class="overlay" id="ovAdd">
  <div class="panel">
    <h3 id="addTitle">Nueva web</h3>
    <label for="fUrl">Dirección</label>
    <input id="fUrl" type="url" placeholder="https://..." autocomplete="off">
    <div class="preview" id="preview"><div class="t">Escribe la dirección para ver el icono</div></div>
    <label for="fName">Nombre</label>
    <input id="fName" type="text" placeholder="Se rellena solo con el dominio">
    <label for="fCat">Categoría</label>
    <select id="fCat"></select>
    <input id="fNewCat" type="text" placeholder="Nombre de la nueva categoría" style="display:none;margin-top:8px">
    <div class="actions">
      <button class="btn danger" id="btnDelete" style="display:none">Eliminar</button>
      <button class="btn" data-close>Cancelar</button>
      <button class="btn primary" id="btnSave">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovOrder">
  <div class="panel">
    <h3>Ordenar categorías</h3>
    <p style="margin:-8px 0 16px;color:var(--muted);font-size:14px">La primera de la lista se muestra arriba. Arrastra o usa las flechas. Doble clic en el nombre para renombrar.</p>
    <ul class="order-list" id="orderList"></ul>
    <div class="actions"><button class="btn primary" data-close>Listo</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  /* ======= CONFIGURA ESTO ======= */
  const API   = 'https://script.google.com/macros/s/AKfycbz4WF7H7HZXw4CnT4HMYgCJ3MBpZo-U1aUqlY4Ysiq9TFXuZQg76sNZlsHJflw1Ws91kg/exec';   // URL /exec de la implementación de Apps Script
  const CLAVE = '2757';       // la misma que en Code.gs
  /* ============================== */

  let state = { cats: [], links: [] };

  /* ---------- API JSONP ---------- */
  function api(params){
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      const t = setTimeout(() => { cleanup(); reject(new Error('Sin respuesta del servidor')); }, 20000);
      function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = data => { cleanup(); data.ok ? resolve(data) : reject(new Error(data.error || 'Error')); };
      s.onerror = () => { cleanup(); reject(new Error('No se pudo conectar con Apps Script')); };
      const q = new URLSearchParams({ ...params, clave: CLAVE, callback: cb, _: Date.now() });
      s.src = API + '?' + q.toString();
      document.head.appendChild(s);
    });
  }
  async function load(){
    try{
      const d = await api({ action: 'list' });
      state = { cats: d.cats, links: d.links };
      render();
    }catch(err){
      main.innerHTML = `<div class="empty error"><div class="pulse">!</div>
        No se pudo cargar: <strong>${esc(err.message)}</strong><br>
        Revisa que <code>API</code> y <code>CLAVE</code> en index.html coinciden con la implementación de Apps Script.</div>`;
    }
  }
  async function run(params, okMsg){
    const sync = document.getElementById('sync');
    document.body.classList.add('busy'); sync.classList.add('show');
    try{
      await api(params);
      await load();
      if(okMsg) toast(okMsg);
      return true;
    }catch(err){ toast(err.message, true); return false; }
    finally{ document.body.classList.remove('busy'); sync.classList.remove('show'); }
  }

  /* ---------- Utilidades ---------- */
  const host = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = u => { u = u.trim(); return u && !/^https?:\/\//i.test(u) ? 'https://' + u : u; };


  /* ---------- Iconos (favicons) ----------
     Google s2 solo conoce el icono del dominio raiz: para una app que vive en
     una subcarpeta (puntofibra.github.io/panel/) o para un dominio que no tiene
     indexado devuelve el globo generico. Asi que probamos varias fuentes en
     orden y nos quedamos con la primera que devuelva una imagen de verdad. */

  const iconCache = new Map();   // url de la web -> src del icono (o null)
  let iconRun = 0;               // invalida pinturas viejas al recargar

  // Carga una imagen y responde con su src si es valida. minSize sirve para
  // descartar el globo generico de Google, que llega a 16px aunque pidamos 64.
  function loadImg(src, minSize){
    return new Promise(res => {
      if(!src) return res(null);
      const i = new Image();
      const done = v => { clearTimeout(t); i.onload = i.onerror = null; res(v); };
      const t = setTimeout(() => done(null), 7000);
      i.onload  = () => done(i.naturalWidth && i.naturalWidth >= (minSize || 1) ? src : null);
      i.onerror = () => done(null);
      i.src = src;
    });
  }

  // Lee el <link rel="icon"> que declara la propia pagina. Solo funciona con
  // webs del mismo origen (el resto lo bloquea CORS), pero eso cubre todas mis
  // apps de puntofibra.github.io, que es justo donde fallaba.
  async function declaredIcon(u){
    try{
      const url = new URL(u);
      if(url.origin !== location.origin) return null;
      const html = await fetch(u, { cache:'force-cache' }).then(r => r.ok ? r.text() : '');
      if(!html) return null;
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const links = [...doc.querySelectorAll('link[href]')].filter(l =>
        /(^|\s)(icon|shortcut\s+icon|apple-touch-icon(-precomposed)?)(\s|$)/i.test(l.getAttribute('rel') || ''));
      const score = l => (/svg/i.test((l.getAttribute('type')||'') + (l.getAttribute('href')||'')) ? 1000 : 0)
                       + (parseInt((l.getAttribute('sizes')||'0').split(/[xX]/)[0], 10) || 0);
      links.sort((a,b) => score(b) - score(a));
      return links[0] ? new URL(links[0].getAttribute('href'), u).href : null;
    }catch{ return null; }
  }

  async function resolveIcon(u){
    if(iconCache.has(u)) return iconCache.get(u);
    let url; try{ url = new URL(u); }catch{ iconCache.set(u, null); return null; }
    const dir = url.origin + url.pathname.replace(/[^/]*$/, '');
    const cands = [
      [await declaredIcon(u), 0],
      [dir + 'favicon.svg', 0], [dir + 'favicon.ico', 0],
      [dir + 'icon.svg', 0], [dir + 'icon.png', 0], [dir + 'icon-192.png', 0],
      [url.origin + '/favicon.svg', 0], [url.origin + '/favicon.ico', 0],
      ['https://icons.duckduckgo.com/ip3/' + url.hostname + '.ico', 0],
      ['https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=64&url=' + encodeURIComponent(url.origin + '/'), 17],
      ['https://www.google.com/s2/favicons?domain=' + encodeURIComponent(url.hostname) + '&sz=64', 17]
    ];
    let out = null;
    for(const [src, min] of cands){ out = await loadImg(src, min); if(out) break; }
    iconCache.set(u, out);
    return out;
  }

  // Mientras se resuelve se ve la inicial; al resolverse se sustituye por el icono.
  function paintIcons(scope){
    const run = iconRun;
    scope.querySelectorAll('[data-icon]').forEach(async box => {
      const src = await resolveIcon(box.dataset.icon);
      if(src && run === iconRun && box.isConnected)
        box.innerHTML = `<img src="${esc(src)}" alt="" loading="lazy">`;
    });
  }

  /* ---------- Render ---------- */
  const main = document.getElementById('main');
  function render(){
    document.getElementById('count').textContent = state.links.length
      ? `${state.links.length} web${state.links.length===1?'':'s'} · ${state.cats.length} categoría${state.cats.length===1?'':'s'}` : '';
    if(!state.links.length){
      main.innerHTML = `<div class="empty"><div class="pulse">+</div>
        Todavía no hay nada aquí.<br><strong>Haz triple clic en el fondo</strong> para añadir tu primera web.</div>`;
      return;
    }
    main.innerHTML = state.cats.map(c => {
      const ls = state.links.filter(l => l.cat === c.id);
      if(!ls.length) return '';
      return `<section class="cat"><h2>${esc(c.name)}</h2><div class="grid">${ls.map(tile).join('')}</div></section>`;
    }).join('');
    paintIcons(main);
  }
  function tile(l){
    const letter = esc((l.name||host(l.url)||'?')[0].toUpperCase());
    return `<a class="tile" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.url)}">
      <div class="ico" data-icon="${esc(l.url)}">${letter}</div>
      <div class="name">${esc(l.name)}</div>
      <button class="more" data-edit="${l.id}" title="Editar" aria-label="Editar ${esc(l.name)}">⋯</button>
    </a>`;
  }
  main.addEventListener('click', e => {
    const b = e.target.closest('[data-edit]');
    if(b){ e.preventDefault(); openAdd(b.dataset.edit); }
  });

  /* ---------- Triple clic en el fondo ---------- */
  const menu = document.getElementById('menu');
  let clicks = 0, timer;
  document.addEventListener('click', e => {
    if(e.target.closest('.tile, .fab-menu, .overlay, .panel, button, a, input, select')){ closeMenu(); return; }
    closeMenu();
    clicks++; clearTimeout(timer);
    timer = setTimeout(() => clicks = 0, 500);
    if(clicks === 3){ clicks = 0; openMenu(e.clientX, e.clientY); }
  });
  function openMenu(x,y){
    menu.classList.add('open');
    menu.style.left = Math.min(x, innerWidth - menu.offsetWidth - 12) + 'px';
    menu.style.top  = Math.min(y, innerHeight - menu.offsetHeight - 12) + 'px';
  }
  function closeMenu(){ menu.classList.remove('open'); }
  menu.addEventListener('click', e => {
    const act = e.target.closest('button')?.dataset.act;
    closeMenu();
    if(act === 'add') openAdd();
    if(act === 'order') openOrder();
    if(act === 'reload'){ iconCache.clear(); iconRun++; load().then(() => toast('Actualizado')); }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeMenu(); closeOverlays(); } });

  /* ---------- Añadir / editar ---------- */
  const ovAdd = document.getElementById('ovAdd');
  const fUrl = document.getElementById('fUrl'), fName = document.getElementById('fName');
  const fCat = document.getElementById('fCat'), fNewCat = document.getElementById('fNewCat');
  const preview = document.getElementById('preview'), btnSave = document.getElementById('btnSave');
  let editing = null, nameTouched = false;

  function fillCats(selected){
    fCat.innerHTML = state.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
      + `<option value="__new">+ Nueva categoría…</option>`;
    fCat.value = selected || (state.cats[0]?.id ?? '__new');
    fNewCat.style.display = fCat.value === '__new' ? 'block' : 'none';
  }
  fCat.addEventListener('change', () => {
    fNewCat.style.display = fCat.value === '__new' ? 'block' : 'none';
    if(fCat.value === '__new') fNewCat.focus();
  });
  function openAdd(id){
    editing = id ? state.links.find(l => l.id === id) : null;
    nameTouched = !!editing;
    document.getElementById('addTitle').textContent = editing ? 'Editar web' : 'Nueva web';
    document.getElementById('btnDelete').style.display = editing ? '' : 'none';
    fUrl.value = editing?.url || ''; fName.value = editing?.name || ''; fNewCat.value = '';
    fillCats(editing?.cat); updatePreview();
    ovAdd.classList.add('open'); fUrl.focus();
  }
  let previewT;
  function updatePreview(){
    const u = norm(fUrl.value), h = host(u);
    clearTimeout(previewT);
    if(!h){ preview.innerHTML = `<div class="t">Escribe la dirección para ver el icono</div>`; return; }
    if(!nameTouched) fName.value = h.split('.')[0].replace(/^\w/, c => c.toUpperCase());
    const letter = esc((fName.value || h)[0].toUpperCase());
    preview.innerHTML = `<div class="ico" data-icon="${esc(u)}">${letter}</div><div class="t"><b>${esc(fName.value)}</b>${esc(h)}</div>`;
    previewT = setTimeout(() => paintIcons(preview), 450);   // espera a que termine de escribir
  }
  fUrl.addEventListener('input', updatePreview);
  fName.addEventListener('input', () => { nameTouched = true; updatePreview(); });
  [fUrl,fName,fNewCat].forEach(el => el.addEventListener('keydown', e => { if(e.key==='Enter') btnSave.click(); }));

  btnSave.addEventListener('click', async () => {
    const url = norm(fUrl.value);
    if(!host(url)){ toast('Escribe una dirección válida', true); fUrl.focus(); return; }
    const params = { url, nombre: fName.value.trim() || host(url) };
    if(fCat.value === '__new'){
      const n = fNewCat.value.trim();
      if(!n){ toast('Pon nombre a la categoría', true); fNewCat.focus(); return; }
      params.nuevaCat = n;
    } else params.cat = fCat.value;
    btnSave.disabled = true;
    const ok = editing
      ? await run({ action:'editLink', id: editing.id, ...params }, 'Guardado')
      : await run({ action:'addLink', ...params }, 'Web añadida');
    btnSave.disabled = false;
    if(ok) closeOverlays();
  });
  document.getElementById('btnDelete').addEventListener('click', async () => {
    if(!editing || !confirm(`¿Eliminar "${editing.name}"?`)) return;
    if(await run({ action:'delLink', id: editing.id }, 'Eliminada')) closeOverlays();
  });

  /* ---------- Ordenar categorías ---------- */
  const ovOrder = document.getElementById('ovOrder');
  const orderList = document.getElementById('orderList');
  function openOrder(){
    if(!state.cats.length){ toast('Aún no hay categorías', true); return; }
    renderOrder(); ovOrder.classList.add('open');
  }
  function renderOrder(){
    orderList.innerHTML = state.cats.map((c,i) => {
      const n = state.links.filter(l => l.cat === c.id).length;
      return `<li draggable="true" data-i="${i}">
        <span class="grip">⠿</span>
        <span class="nm" title="Doble clic para renombrar">${esc(c.name)}</span>
        <span class="n">${n}</span>
        <button class="ic" data-up ${i===0?'disabled':''} aria-label="Subir">↑</button>
        <button class="ic" data-down ${i===state.cats.length-1?'disabled':''} aria-label="Bajar">↓</button>
        <button class="ic" data-del aria-label="Eliminar categoría" title="Eliminar categoría">✕</button>
      </li>`;
    }).join('');
  }
  async function move(from,to){
    if(to<0 || to>=state.cats.length || from===to) return;
    const [c] = state.cats.splice(from,1); state.cats.splice(to,0,c);
    render(); renderOrder();                                   // respuesta inmediata
    await run({ action:'orderCats', ids: state.cats.map(c => c.id).join(',') });
    renderOrder();
  }
  orderList.addEventListener('click', async e => {
    const li = e.target.closest('li'); if(!li) return;
    const i = +li.dataset.i;
    if(e.target.closest('[data-up]')) move(i,i-1);
    if(e.target.closest('[data-down]')) move(i,i+1);
    if(e.target.closest('[data-del]')){
      const c = state.cats[i];
      const n = state.links.filter(l => l.cat === c.id).length;
      if(!confirm(n ? `"${c.name}" tiene ${n} web(s). Se eliminarán también. ¿Continuar?` : `¿Eliminar "${c.name}"?`)) return;
      await run({ action:'delCat', id: c.id }, 'Categoría eliminada');
      state.cats.length ? renderOrder() : closeOverlays();
    }
  });
  orderList.addEventListener('dblclick', async e => {
    const nm = e.target.closest('.nm'); if(!nm) return;
    const i = +nm.closest('li').dataset.i;
    const name = prompt('Nuevo nombre', state.cats[i].name);
    if(name && name.trim() && name.trim() !== state.cats[i].name){
      await run({ action:'renameCat', id: state.cats[i].id, nombre: name.trim() }, 'Renombrada');
      renderOrder();
    }
  });
  let dragFrom = null;
  orderList.addEventListener('dragstart', e => { const li = e.target.closest('li'); dragFrom = +li.dataset.i; li.classList.add('dragging'); });
  orderList.addEventListener('dragover', e => e.preventDefault());
  orderList.addEventListener('drop', e => {
    e.preventDefault(); const li = e.target.closest('li');
    if(li && dragFrom !== null) move(dragFrom, +li.dataset.i);
    dragFrom = null;
  });
  orderList.addEventListener('dragend', e => e.target.closest('li')?.classList.remove('dragging'));

  /* ---------- Overlays y toast ---------- */
  function closeOverlays(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeOverlays));
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target === o) closeOverlays(); }));
  let toastT;
  function toast(msg, err){
    const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }

  load();
})();
</script>
</body>
</html>
